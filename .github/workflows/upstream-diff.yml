name: upstream-diff

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run
# useless, and the run holds a runner for minutes.
concurrency:
  group: upstream-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pinned upstream
        run: |
          git remote add simon https://git.tartarus.org/simon/puzzles.git
          git fetch --no-tags simon main

      - name: Vendored files must match UPSTREAM-FILES.txt
        run: tools/check-upstream-diff.sh --strict

      - name: UPSTREAM.lock and the README line must agree
        run: tools/check-upstream-lock.sh
